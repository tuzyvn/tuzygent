[package]
name = "agent-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Standalone REST & WebSocket Daemon Server for AgentCore"

[lints]
workspace = true


[lib]
name = "agent_server"
path = "src/lib.rs"

[[bin]]
name = "agent-server"
path = "src/main.rs"

[dependencies]
agent-core = { workspace = true }
agent-domain = { workspace = true }
agent-engine = { workspace = true }
agent-memory = { workspace = true }
agent-runtime = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
tokio-tungstenite = "0.29.0"
