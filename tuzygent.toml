[defaults]
engine = "antigravity"
timeout_seconds = 180
sandbox_driver = "bubblewrap"

[security]
allowed_env_vars = [
    "CODEX_API_KEY",
    "CODEX_BIN",
    "ANTHROPIC_API_KEY",
    "GEMINI_API_KEY",
    "OPENAI_API_KEY",
    "ANTIGRAVITY_API_KEY",
    "AGY_BIN"
]
mount_credentials = [
    { source = "~/.codex/auth.json", target = "/root/.codex/auth.json", readonly = true },
    { source = "~/.gemini", target = "/root/.gemini", readonly = true },
    { source = "~/.claude", target = "/root/.claude", readonly = true }
]

[engines.antigravity]
kind = "antigravity"
binary_path = "agy"
args = ["--interactive=false", "--output-format", "stream-json", "--message", "{prompt}"]
interactive_fallback = "tmux"

[engines.claude]
kind = "claude_code"
binary_path = "claude"
args = ["-p", "{prompt}", "--output-format", "json"]
interactive_fallback = "tmux"

[engines.fast_echo]
kind = "generic"
binary_path = "bash"
args = ["-c", 'printf "%s\n" "[FastEcho Engine]:" "$1"', "fast_echo", "{prompt}"]
output_parser = "raw"

[engines.codex]
kind = "codex"
output_parser = "codex_jsonl"
# Set binary_path to an installed executable, or set CODEX_BIN.
# Omit model to use the Codex CLI configured model.
